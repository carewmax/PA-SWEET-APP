name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project from the Pa Sweet site
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          mkdir www resources
          cp -r ../pa-sweet/. www/
          cp ../pa-sweet/icons/icon-1024.png resources/icon-only.png
          cp ../pa-sweet/icons/icon-foreground.png resources/icon-foreground.png
          cp ../pa-sweet/icons/icon-background.png resources/icon-background.png
          echo '{"appId":"com.pasweet.bakery","appName":"Pa Sweet","webDir":"www","backgroundColor":"#FBF3EC"}' > capacitor.config.json
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-sweet-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
